services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Relational Persistence Database
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mlo11y_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlo11y_db}
      POSTGRES_USER: ${POSTGRES_USER:-mlo11y_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlo11y_admin} -d ${POSTGRES_DB:-mlo11y_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Central API Security Analytics & Active Defense Platform
  # -------------------------------------------------------------
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlo11y_platform
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlo11y_admin}:${POSTGRES_PASSWORD:-postgres_secure_pass_123}@db:5432/${POSTGRES_DB:-mlo11y_db}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-real-secret-key-32-bytes-long}
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dashboard.yourcompany.com}
      MAX_CONTENT_LENGTH: 5242880
      COLLECTOR_MAX_PAYLOAD_BYTES: 65536
      RATE_LIMIT_PER_MINUTE: 50
      RATE_LIMIT_BURST: 30
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
